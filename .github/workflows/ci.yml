name: ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
      - name: Run tests
        run: python -m pytest
      - name: Validate sanitized captures
        run: |
          for d in v*/manifest.json; do
            python scripts/validate-capture.py "${d%/manifest.json}" --require-sanitized
          done
